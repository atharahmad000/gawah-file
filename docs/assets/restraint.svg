<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc">
<title id="title">Two alerts, different recommendations, the same human gate</title><desc id="desc">A1 proposes freeze from corroborated first-credit evidence. A4 proposes watch because an established customer has no first-credit drain. Both wait for human review.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#81969C"/></marker></defs>
<rect x="0" y="0" width="1200" height="666" rx="0" fill="#F5F3ED" stroke="none"/>
<text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#087F75">A USEFUL INVESTIGATION KNOWS WHEN TO SHOW RESTRAINT</text>
<text x="48" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#102D38">Different evidence. Different recommendations.</text>
