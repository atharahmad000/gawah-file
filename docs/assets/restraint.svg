<rect x="624" y="151" width="528" height="6" rx="0" fill="#087F75" stroke="none"/>
<text x="650" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#087F75">A4 / AYESHA</text>
<text x="650" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" fill="#102D38">One unusual transfer</text>
