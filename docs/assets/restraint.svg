<text x="80" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF">SAME CONTROL: both files pause for a human signature before an approved draft is recorded.</text>
<text x="48" y="649" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#50676F">Synthetic examples. A draft freeze is a proposal; this demonstration never changes wallet status.</text>
